name: tests

on:
  push:
  pull_request:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # The raw Dataverse files aren't needed: the tests run the real sql/ files
      # and helpers on a small synthetic panel with hand-checked answers.
      - run: python -m pytest tests/ -v
